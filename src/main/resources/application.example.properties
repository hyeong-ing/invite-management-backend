spring.application.name=InviteVip

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.elasticsearch.uris=${ES_URL}
spring.elasticsearch.username=${ES_USERNAME}
spring.elasticsearch.password=${ES_PASSWORD}
spring.ssl.bundle.pem.es-ca.truststore.certificate=${ES_CA_CERT}
spring.elasticsearch.restclient.ssl.bundle=es-ca
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s

app.search-sync.enabled=true
app.search-sync.poll-delay-ms=2000
app.search-sync.reconcile-delay-ms=300000
app.search-sync.batch-size=50
app.search-sync.max-attempts=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

keycloak.server-url=${KEYCLOAK_URL}
keycloak.realm=${KEYCLOAK_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
