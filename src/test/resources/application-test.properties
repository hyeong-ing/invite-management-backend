spring.datasource.url=jdbc:h2:mem:search-sync;MODE=MySQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.elasticsearch.uris=http://127.0.0.1:1
spring.elasticsearch.username=
spring.elasticsearch.password=
spring.elasticsearch.restclient.ssl.bundle=
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://127.0.0.1:1/unused
keycloak.server-url=http://127.0.0.1:1
keycloak.realm=test
keycloak.client-id=test
keycloak.admin.username=test
keycloak.admin.password=test
app.search-sync.enabled=false
app.search-sync.max-attempts=3
app.search-sync.batch-size=50

app.account-sync.enabled=false
app.account-sync.max-attempts=3
