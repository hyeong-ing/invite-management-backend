name: invitevip-sync-test
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: sync-test-only
      MYSQL_DATABASE: invitevip_sync_test
    ports:
      - "127.0.0.1:13316:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psync-test-only"]
      interval: 3s
      timeout: 3s
      retries: 40
  elasticsearch:
    build:
      context: .
      dockerfile: test-infra/elasticsearch.Dockerfile
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:19216:9200"
    tmpfs:
      - /usr/share/elasticsearch/data:uid=1000,gid=0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow' >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 60
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    command: start-dev
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: account-test-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: account-test-only
    ports:
      - "127.0.0.1:18116:8080"
    tmpfs:
      - /opt/keycloak/data:uid=1000,gid=0
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3;
          IFS= read -r status <&3;
          [[ $$status == *200* ]]
      interval: 3s
      timeout: 3s
      retries: 40
